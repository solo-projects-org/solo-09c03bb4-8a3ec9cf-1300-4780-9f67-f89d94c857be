services:
  deid-service:
    build: .
    image: followup-deid-service:1.0.0
    container_name: followup-deid-service
    ports:
      - "8000:8000"
    environment:
      DEID_DATA_DIR: /data
      DEID_WORKER_INTERVAL: "1"
    volumes:
      - deid-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  deid-data:
